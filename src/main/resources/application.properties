spring.application.name=HostelManagement
server.port=8080

# Static resources mapping (serves compiled React frontend & assets)
spring.web.resources.static-locations=classpath:/static/

# Jackson configuration
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ===================================================================
# Database Connection (MySQL / SQL)
# ===================================================================
# MySQL Database Connection (Reads from environment variable or falls back to 'root')
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hostel_management?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate SQL Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Open in view
spring.jpa.open-in-view=true

# ===================================================================
# H2 In-Memory SQL Fallback Configuration
# If MySQL service is not running on your computer, you can switch to H2:
# spring.datasource.url=jdbc:h2:mem:hosteldb;DB_CLOSE_DELAY=-1;MODE=MySQL
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# ===================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
