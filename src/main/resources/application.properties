spring.application.name=HostelManagement
server.port=8080

# Static resources mapping
spring.web.resources.static-locations=classpath:/static/

# Jackson configuration to prevent any strict JSON deserialization errors
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ===================================================================
# Database Configuration Guide:
# The application runs with high-performance in-memory persistence
# matching the exact architecture pattern of the reference backend.
# If your professor requests MySQL DB connection:
# 1. Ensure MySQL Server is running on port 3306
# 2. Create database: CREATE DATABASE hostel_management;
# 3. Add spring-boot-starter-data-jpa & mysql-connector-j to pom.xml
# 4. Uncomment the lines below:
# ===================================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/hostel_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
