<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rooms - StayEase</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon"><i class="fas fa-building"></i></div>
            <div class="brand-text">
                <h2>StayEase</h2>
                <span>Hostel Management</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-label">Main Menu</div>
            <a href="index.html"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="owners.html"><i class="fas fa-user-tie"></i> Owners</a>
            <a href="rooms.html" class="active"><i class="fas fa-door-open"></i> Rooms</a>
            <a href="tenants.html"><i class="fas fa-users"></i> Tenants</a>
            <div class="nav-label">Transactions</div>
            <a href="rentpayments.html"><i class="fas fa-money-bill-wave"></i> Rent Payments</a>
            <a href="complaints.html"><i class="fas fa-exclamation-circle"></i> Complaints</a>
        </nav>
        <div class="sidebar-footer">
            &copy; 2024 StayEase. All rights reserved.
        </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
        <header class="top-header">
            <div class="page-title"><i class="fas fa-door-open"></i> Room Management</div>
            <div class="header-actions">
                <div class="header-date"><i class="far fa-calendar-alt"></i> <span id="headerDate"></span></div>
            </div>
        </header>

        <div class="content-area">
            <div class="section-header">
                <h2>All Rooms</h2>
                <button class="btn btn-primary" onclick="openAddRoomModal()">
                    <i class="fas fa-plus"></i> Add Room
                </button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Owner ID</th>
                            <th>Room Number</th>
                            <th>Type</th>
                            <th>Rent Amount</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="roomsTableBody">
                        <tr><td colspan="7"><div class="loading"><i class="fas fa-spinner"></i> Loading...</div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Room Modal -->
    <div class="modal-overlay" id="roomModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="roomModalTitle">Add New Room</h3>
                <button class="modal-close" onclick="closeModal('roomModal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="roomForm" onsubmit="event.preventDefault(); saveRoom();">
                    <input type="hidden" id="roomFormMode" value="add">
                    <div class="form-row">
                        <div class="form-group">
                            <label>ID <span class="required">*</span></label>
                            <input type="number" id="roomId" class="form-control" placeholder="Room ID" required>
                        </div>
                        <div class="form-group">
                            <label>Owner ID <span class="required">*</span></label>
                            <input type="number" id="roomOwnerId" class="form-control" placeholder="Owner ID" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Room Number <span class="required">*</span></label>
                            <input type="text" id="roomNumber" class="form-control" placeholder="e.g. A-101" required>
                        </div>
                        <div class="form-group">
                            <label>Type <span class="required">*</span></label>
                            <select id="roomType" class="form-control" required>
                                <option value="Single">Single</option>
                                <option value="Double">Double</option>
                                <option value="Triple">Triple</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Rent Amount (₹) <span class="required">*</span></label>
                            <input type="number" id="roomRentAmount" class="form-control" placeholder="Monthly rent" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label>Status <span class="required">*</span></label>
                            <select id="roomStatus" class="form-control" required>
                                <option value="Available">Available</option>
                                <option value="Occupied">Occupied</option>
                                <option value="Maintenance">Maintenance</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('roomModal')">Cancel</button>
                <button class="btn btn-primary" onclick="saveRoom()"><i class="fas fa-save"></i> Save Room</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadRooms();
            setupModalClose('roomModal');
        });
    </script>
</body>
</html>
