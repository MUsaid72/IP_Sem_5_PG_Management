<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints - StayEase</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon"><i class="fas fa-building"></i></div>
            <div class="brand-text">
                <h2>StayEase</h2>
                <span>Hostel Management</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-label">Main Menu</div>
            <a href="index.html"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="owners.html"><i class="fas fa-user-tie"></i> Owners</a>
            <a href="rooms.html"><i class="fas fa-door-open"></i> Rooms</a>
            <a href="tenants.html"><i class="fas fa-users"></i> Tenants</a>
            <div class="nav-label">Transactions</div>
            <a href="rentpayments.html"><i class="fas fa-money-bill-wave"></i> Rent Payments</a>
            <a href="complaints.html" class="active"><i class="fas fa-exclamation-circle"></i> Complaints</a>
        </nav>
        <div class="sidebar-footer">
            &copy; 2024 StayEase. All rights reserved.
        </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
        <header class="top-header">
            <div class="page-title"><i class="fas fa-exclamation-circle"></i> Complaint Ticketing</div>
            <div class="header-actions">
                <div class="header-date"><i class="far fa-calendar-alt"></i> <span id="headerDate"></span></div>
            </div>
        </header>

        <div class="content-area">
            <div class="section-header">
                <h2>All Complaints</h2>
                <button class="btn btn-primary" onclick="openAddComplaintModal()">
                    <i class="fas fa-plus"></i> Add Complaint
                </button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tenant ID</th>
                            <th>Title</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Created Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="complaintsTableBody">
                        <tr><td colspan="7"><div class="loading"><i class="fas fa-spinner"></i> Loading...</div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Complaint Modal -->
    <div class="modal-overlay" id="complaintModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="complaintModalTitle">Add New Complaint</h3>
                <button class="modal-close" onclick="closeModal('complaintModal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="complaintForm" onsubmit="event.preventDefault(); saveComplaint();">
                    <input type="hidden" id="complaintFormMode" value="add">
                    <div class="form-row">
                        <div class="form-group">
                            <label>ID <span class="required">*</span></label>
                            <input type="number" id="complaintId" class="form-control" placeholder="Complaint ID" required>
                        </div>
                        <div class="form-group">
                            <label>Tenant ID <span class="required">*</span></label>
                            <input type="number" id="complaintTenantId" class="form-control" placeholder="Tenant ID" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Title <span class="required">*</span></label>
                        <input type="text" id="complaintTitle" class="form-control" placeholder="Brief complaint title" required>
                    </div>
                    <div class="form-group">
                        <label>Description <span class="required">*</span></label>
                        <textarea id="complaintDescription" class="form-control" placeholder="Detailed description of the complaint" rows="4" required></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Status <span class="required">*</span></label>
                            <select id="complaintStatus" class="form-control" required>
                                <option value="Open">Open</option>
                                <option value="InProgress">In Progress</option>
                                <option value="Resolved">Resolved</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Created Date <span class="required">*</span></label>
                            <input type="date" id="complaintCreatedDate" class="form-control" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('complaintModal')">Cancel</button>
                <button class="btn btn-primary" onclick="saveComplaint()"><i class="fas fa-save"></i> Save Complaint</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadComplaints();
            setupModalClose('complaintModal');
        });
    </script>
</body>
</html>
