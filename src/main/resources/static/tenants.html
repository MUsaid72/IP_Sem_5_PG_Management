<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenants - StayEase</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon"><i class="fas fa-building"></i></div>
            <div class="brand-text">
                <h2>StayEase</h2>
                <span>Hostel Management</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <div class="nav-label">Main Menu</div>
            <a href="index.html"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="owners.html"><i class="fas fa-user-tie"></i> Owners</a>
            <a href="rooms.html"><i class="fas fa-door-open"></i> Rooms</a>
            <a href="tenants.html" class="active"><i class="fas fa-users"></i> Tenants</a>
            <div class="nav-label">Transactions</div>
            <a href="rentpayments.html"><i class="fas fa-money-bill-wave"></i> Rent Payments</a>
            <a href="complaints.html"><i class="fas fa-exclamation-circle"></i> Complaints</a>
        </nav>
        <div class="sidebar-footer">
            &copy; 2024 StayEase. All rights reserved.
        </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
        <header class="top-header">
            <div class="page-title"><i class="fas fa-users"></i> Tenant Management</div>
            <div class="header-actions">
                <div class="header-date"><i class="far fa-calendar-alt"></i> <span id="headerDate"></span></div>
            </div>
        </header>

        <div class="content-area">
            <div class="section-header">
                <h2>All Tenants</h2>
                <button class="btn btn-primary" onclick="openAddTenantModal()">
                    <i class="fas fa-plus"></i> Add Tenant
                </button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Room ID</th>
                            <th>Status</th>
                            <th>Application Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tenantsTableBody">
                        <tr><td colspan="8"><div class="loading"><i class="fas fa-spinner"></i> Loading...</div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Tenant Modal -->
    <div class="modal-overlay" id="tenantModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="tenantModalTitle">Add New Tenant</h3>
                <button class="modal-close" onclick="closeModal('tenantModal')"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="tenantForm" onsubmit="event.preventDefault(); saveTenant();">
                    <input type="hidden" id="tenantFormMode" value="add">
                    <div class="form-row">
                        <div class="form-group">
                            <label>ID <span class="required">*</span></label>
                            <input type="number" id="tenantId" class="form-control" placeholder="Tenant ID" required>
                        </div>
                        <div class="form-group">
                            <label>Room ID <span class="required">*</span></label>
                            <input type="number" id="tenantRoomId" class="form-control" placeholder="Assigned Room ID" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Name <span class="required">*</span></label>
                        <input type="text" id="tenantName" class="form-control" placeholder="Full name" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Email <span class="required">*</span></label>
                            <input type="email" id="tenantEmail" class="form-control" placeholder="Email address" required>
                        </div>
                        <div class="form-group">
                            <label>Phone <span class="required">*</span></label>
                            <input type="text" id="tenantPhone" class="form-control" placeholder="Phone number" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Status <span class="required">*</span></label>
                            <select id="tenantStatus" class="form-control" required>
                                <option value="Applied">Applied</option>
                                <option value="Approved">Approved</option>
                                <option value="Rejected">Rejected</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Application Date <span class="required">*</span></label>
                            <input type="date" id="tenantApplicationDate" class="form-control" required>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('tenantModal')">Cancel</button>
                <button class="btn btn-primary" onclick="saveTenant()"><i class="fas fa-save"></i> Save Tenant</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadTenants();
            setupModalClose('tenantModal');
        });
    </script>
</body>
</html>
